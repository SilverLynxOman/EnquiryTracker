# Supabase CLI settings for this project (used by `supabase link` / `supabase db push`, locally and in
# .github/workflows/migrations.yml). Only values that differ from the CLI defaults are listed.
project_id = "enquiry-tracker"

[db]
# Matches the hosted project (Postgres 17), so a local `supabase start` runs the same major version.
major_version = 17

[functions.gmail-sync]
# Called by pg_cron with a Vault secret (not a JWT) and by editors with their session token; the function
# checks both itself (supabase/functions/gmail-sync/index.ts), so the gateway must not require a JWT.
verify_jwt = false

[functions.user-admin]
# Called by the owner from Settings with their session token; the function checks the token and that the caller is
# an active owner itself (supabase/functions/user-admin/index.ts), like gmail-sync.
verify_jwt = false

[functions.gmail-send]
# Called by editors with their session token (Inbox → Reply); the function checks the token, that the caller may
# edit, and reads the answered e-mail with the caller's token so Row Level Security applies (gmail-send/index.ts).
verify_jwt = false
