name: Database migrations

# Keeps the production Supabase database in step with supabase/migrations.
# - Pull requests that change migrations: a dry run lists what would be applied, and fails on drift
#   (a version applied in Supabase that has no file here).
# - Merges to main that change migrations: the new files are applied. Versions already applied are
#   skipped, so a re-run is harmless. Run it by hand from the Actions tab after adding the secrets.
#
# One-time setup (Settings > Secrets and variables > Actions > New repository secret):
#   SUPABASE_ACCESS_TOKEN  personal access token, https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   database password, Supabase > Project Settings > Database

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/migrations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: supabase-migrations-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_REF: jaaueukrzijesejjaplt
  SUPABASE_CLI_VERSION: 2.122.1

jobs:
  plan:
    name: Preview migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning title=Migrations not checked::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets, or merging this pull request will not apply its migrations."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link the project
        if: steps.secrets.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migrations in Supabase and in this branch
        if: steps.secrets.outputs.ok == 'true'
        run: supabase migration list --linked
      - name: What merging would apply
        if: steps.secrets.outputs.ok == 'true'
        run: supabase db push --linked --dry-run

  apply:
    name: Apply migrations
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error title=Migrations not applied::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets (Settings > Secrets and variables > Actions), then re-run this workflow."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Before
        run: supabase migration list --linked
      - name: Apply new migrations
        run: supabase db push --linked
      - name: After
        run: supabase migration list --linked
