name: Database migrations

# Keeps the production Supabase database in step with supabase/migrations.
# - Pull requests that change migrations: a dry run lists what would be applied, and fails on drift
#   (a version applied in Supabase that has no file here).
# - Merges to main that change migrations: the new files are applied. Versions already applied are
#   skipped, so a re-run is harmless. Run it by hand from the Actions tab after adding the secret.
#
# It connects straight to the database through the session pooler with the database password, so it
# needs no Supabase access token (a scoped or read-only token cannot run `supabase link`).
#
# One-time setup (Settings > Secrets and variables > Actions > New repository secret):
#   SUPABASE_DB_PASSWORD   database password, Supabase > Project Settings > Database

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/migrations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: supabase-migrations-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_REF: jaaueukrzijesejjaplt
  # Session pooler (IPv4, port 5432) for the project's region, eu-west-1.
  SUPABASE_DB_HOST: aws-0-eu-west-1.pooler.supabase.com
  SUPABASE_CLI_VERSION: 2.122.1

jobs:
  plan:
    name: Preview migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning title=Migrations not checked::Add the SUPABASE_DB_PASSWORD repository secret, or merging this pull request will not apply its migrations."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Database address
        if: steps.secrets.outputs.ok == 'true'
        run: |
          password=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${password}@${SUPABASE_DB_HOST}:5432/postgres"
          echo "::add-mask::$password"
          echo "SUPABASE_DB_URL=$url" >> "$GITHUB_ENV"
      - name: Migrations in Supabase and in this branch
        if: steps.secrets.outputs.ok == 'true'
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: What merging would apply
        if: steps.secrets.outputs.ok == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

  apply:
    name: Apply migrations
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error title=Migrations not applied::Add the SUPABASE_DB_PASSWORD repository secret (Settings > Secrets and variables > Actions), then re-run this workflow."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Database address
        run: |
          password=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${password}@${SUPABASE_DB_HOST}:5432/postgres"
          echo "::add-mask::$password"
          echo "SUPABASE_DB_URL=$url" >> "$GITHUB_ENV"
      - name: Before
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Apply new migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - name: After
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
